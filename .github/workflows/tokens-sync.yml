name: Sync Tokens to Figma

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the generated plan to Figma (false previews only)
        type: boolean
        default: false

concurrency:
  group: tokens-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-to-figma:
    name: Plan and optionally push tokens to Figma
    runs-on: ubuntu-latest
    environment: figma-sync
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Preview or apply
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = true ]; then
            npm run tokens:push:apply
          else
            npm run tokens:push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figma-sync-plan
          path: .local/figma/sync-plan.json
          include-hidden-files: true
