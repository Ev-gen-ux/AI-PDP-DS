name: Developer and systems CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  developer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run env:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:tooling
  ai-pdp-ds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-pdp-ds
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: projects/ai-pdp-ds/.nvmrc
          cache: npm
          cache-dependency-path: projects/ai-pdp-ds/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - run: npm run quality:report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-pdp-ds-quality
          path: |
            projects/ai-pdp-ds/.local/quality/
            projects/ai-pdp-ds/coverage/
          include-hidden-files: true
