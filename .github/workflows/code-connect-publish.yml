name: Publish Code Connect

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.figma.tsx'
      - 'figma.config.json'
  workflow_dispatch:

concurrency:
  group: code-connect-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish Code Connect to Figma
    runs-on: ubuntu-latest
    environment: figma-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --prefer-offline --no-audit

      - name: Generate theme files (needed for typecheck)
        run: npm run tokens:build

      - name: Publish Code Connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: npm run figma:publish
